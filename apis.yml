name: Taptap Send
description: >-
  Taptap Send is a mobile money-transfer (remittance) application that lets people send money
  from Europe, the UK, the US, and Canada to family and businesses across Africa, Asia, and Latin
  America. The service supports bank deposits, mobile-money wallets, and cash pickups in 100+
  receiving countries with competitive exchange rates and low fees, and operates as a licensed
  and regulated money transmitter (FCA regulated, SOC 2 and PCI DSS attested) with bank-level
  encryption. Taptap Send is a consumer-facing app and does not currently publish a public
  developer API, developer portal, or API documentation; this profile captures its company
  identity, security posture, and compliance program.
